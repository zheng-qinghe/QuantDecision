<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKR最优方案计算工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #0dcaf0;
            --bg-color: #f8f9fa;
            --card-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container-fluid { max-width: 1400px; margin: 0 auto; }

        /* 顶部区域 */
        .header-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .header-section h1 {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header-section p { color: #6c757d; font-size: 14px; }

        /* 卡片通用样式 */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }

        .card-header {
            background: white;
            border-bottom: 2px solid var(--bg-color);
            font-weight: 600;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0 !important;
        }

        .card-body { padding: 20px; }

        /* 模式切换 */
        .mode-switch { display: flex; gap: 10px; margin-bottom: 15px; }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .mode-btn:hover { border-color: var(--primary-color); }

        .mode-btn.active {
            border-color: var(--primary-color);
            background: #e7f3ff;
        }

        .mode-btn .mode-title { font-weight: 600; color: #495057; margin-bottom: 5px; }
        .mode-btn .mode-desc { font-size: 12px; color: #6c757d; }

        /* 影响因子配置区 */
        .factor-config { background: white; }

        .factor-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .factor-item:hover { background: #f1f3f5; }

        .factor-row {
            display: grid;
            grid-template-columns: 1fr 100px 80px 40px;
            gap: 10px;
            align-items: center;
        }

        .factor-name-input { font-weight: 500; }
        .direction-select { font-size: 13px; }
        .weight-input { width: 70px; }
        .weight-display { font-weight: 600; color: var(--primary-color); font-size: 14px; }

        .weight-status {
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 10px;
        }

        .weight-status.valid { background: #d4edda; color: #155724; }
        .weight-status.invalid { background: #f8d7da; color: #721c24; }

        /* AHP问答式界面 */
        .ahp-section { margin-top: 20px; padding-top: 20px; border-top: 2px dashed #dee2e6; }

        .ahp-question-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .ahp-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .ahp-progress-text { font-size: 14px; color: #6c757d; }
        .ahp-progress-bar { flex: 1; height: 8px; background: #e9ecef; border-radius: 4px; margin: 0 15px; overflow: hidden; }
        .ahp-progress-fill { height: 100%; background: var(--primary-color); border-radius: 4px; transition: width 0.3s; }

        .comparison-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .comparison-factor {
            flex: 1;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            transition: all 0.3s;
            max-width: 180px;
        }

        .comparison-factor.left { background: #e7f3ff; border: 2px solid #b3d7ff; }
        .comparison-factor.right { background: #fff3cd; border: 2px solid #ffecb5; }
        .comparison-factor.selected { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .comparison-factor.selected.left { border-color: var(--primary-color); background: #cfe2ff; }
        .comparison-factor.selected.right { border-color: var(--warning-color); background: #ffe69c; }

        .comparison-factor .factor-name { font-size: 18px; font-weight: 600; margin-bottom: 5px; }
        .comparison-factor.left .factor-name { color: var(--primary-color); }
        .comparison-factor.right .factor-name { color: #997404; }

        .comparison-factor .factor-hint { font-size: 12px; color: #6c757d; }

        .comparison-vs {
            font-size: 24px;
            font-weight: 700;
            color: #6c757d;
            padding: 10px;
        }

        /* 滑块样式 */
        .slider-container { margin: 20px 0; }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            color: #6c757d;
        }

        .slider-wrapper { position: relative; padding: 10px 0; }

        .importance-slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #e7f3ff 0%, #e7f3ff 40%, #f8f9fa 40%, #f8f9fa 60%, #fff3cd 60%, #fff3cd 100%);
            outline: none;
            -webkit-appearance: none;
        }

        .importance-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .importance-slider::-webkit-slider-thumb:hover { transform: scale(1.1); }

        .slider-value-display {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            font-size: 14px;
        }

        .slider-value-display .value { font-weight: 700; font-size: 18px; color: var(--primary-color); }
        .slider-value-display .description { color: #6c757d; margin-top: 5px; }

        .ahp-nav-buttons { display: flex; justify-content: space-between; gap: 10px; }

        /* AHP结果汇总 */
        .ahp-summary { margin-top: 20px; }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .summary-item .names { font-size: 14px; }
        .summary-item .result { font-weight: 600; color: var(--primary-color); }

        /* 方向标签 */
        .direction-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 500;
        }

        .direction-tag.positive { background: #d4edda; color: #155724; }
        .direction-tag.negative { background: #fff3cd; color: #856404; }

        /* OKR编辑区 */
        .okr-section { background: white; }
        .okr-title-input { font-size: 18px; font-weight: 600; }

        /* KR卡片 */
        .kr-card {
            background: #f8f9fa;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 25px;
            border-radius: 8px;
            padding: 20px;
        }

        .kr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #dee2e6;
        }

        .kr-title-area { display: flex; align-items: center; gap: 12px; flex: 1; }

        .kr-number {
            background: var(--primary-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .kr-title-input { flex: 1; max-width: 500px; font-weight: 600; }

        /* 方案卡片 */
        .plans-container { margin-top: 15px; }

        .plan-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .plan-card:hover { border-color: var(--primary-color); box-shadow: 0 2px 8px rgba(13, 110, 253, 0.15); }

        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #dee2e6;
        }

        .plan-name { font-weight: 600; color: #495057; display: flex; align-items: center; gap: 10px; }
        .plan-name-input { font-weight: 600; width: 200px; }

        .factor-scores-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

        .factor-score-item { background: #f8f9fa; padding: 12px; border-radius: 6px; }
        .factor-score-item label { font-size: 13px; font-weight: 500; color: #495057; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .factor-score-item .hint { font-size: 11px; color: #adb5bd; margin-top: 4px; }

        /* 结果展示区 */
        .result-section { display: none; background: white; animation: fadeIn 0.5s; }
        .result-section.show { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .result-kr-card { background: #f8f9fa; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }

        .result-kr-header {
            background: linear-gradient(135deg, var(--primary-color), #0b5ed7);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-kr-title { font-weight: 600; font-size: 16px; }

        .best-plan-badge {
            background: var(--success-color);
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .result-plans { padding: 15px; }

        .result-plan-item {
            background: white;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            border-left: 4px solid #dee2e6;
        }

        .result-plan-item.best { border-left-color: var(--success-color); background: linear-gradient(90deg, rgba(25, 135, 84, 0.05), white); }

        .result-plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .result-plan-name { font-weight: 600; color: #495057; }
        .result-plan-score { font-size: 28px; font-weight: 700; }
        .result-plan-score.best { color: var(--success-color); }

        .result-scores-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13px;
            color: #6c757d;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #dee2e6;
        }

        .score-detail-item { display: flex; align-items: center; gap: 5px; background: #f8f9fa; padding: 4px 10px; border-radius: 4px; }
        .score-detail-item .value { font-weight: 600; color: #495057; }

        /* 公式说明 */
        .formula-box {
            background: #e7f3ff;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
        }

        .formula-box code {
            background: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: var(--primary-color);
        }

        /* 一致性检验 */
        .consistency-check { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 13px; }
        .consistency-check.pass { background: #d4edda; color: #155724; }
        .consistency-check.fail { background: #f8d7da; color: #721c24; }

        /* 响应式 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header-section h1 { font-size: 22px; }
            .factor-row { grid-template-columns: 1fr; gap: 8px; }
            .factor-scores-grid { grid-template-columns: 1fr; }
            .comparison-display { flex-direction: column; }
            .comparison-vs { transform: rotate(90deg); }
            .comparison-factor { max-width: 100%; }
        }

        .btn-sm { font-size: 13px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 顶部区域 -->
        <div class="header-section">
            <h1>OKR最优方案计算工具</h1>
            <p>基于层次分析法(AHP)的多准则决策，科学确定权重，为每个KR选择最优实现方案</p>
        </div>

        <div class="row">
            <!-- 左侧：影响因子配置 -->
            <div class="col-lg-4">
                <div class="card factor-config">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>影响因子配置</span>
                        <button class="btn btn-primary btn-sm" onclick="addFactor()">+ 添加因子</button>
                    </div>
                    <div class="card-body">
                        <!-- 模式切换 -->
                        <div class="mode-switch">
                            <div class="mode-btn active" id="simpleModeBtn" onclick="switchMode('simple')">
                                <div class="mode-title">简单模式</div>
                                <div class="mode-desc">直接输入权重</div>
                            </div>
                            <div class="mode-btn" id="ahpModeBtn" onclick="switchMode('ahp')">
                                <div class="mode-title">AHP模式</div>
                                <div class="mode-desc">智能比较计算</div>
                            </div>
                        </div>

                        <!-- 因子列表 -->
                        <div id="factorList"></div>

                        <!-- 简单模式 -->
                        <div id="simpleModeSection">
                            <div class="d-flex align-items-center gap-2 mt-3">
                                <button class="btn btn-outline-primary btn-sm" onclick="validateWeights()">校验权重</button>
                                <div id="weightStatus" class="weight-status valid">✓ 权重总和：100%</div>
                            </div>
                        </div>

                        <!-- AHP模式：问答式界面 -->
                        <div id="ahpModeSection" class="ahp-section hidden">
                            <h6 class="mb-3">🔍 因子重要性比较</h6>
                            <p class="text-muted small">通过两两比较，系统自动计算各因子的科学权重</p>
                            
                            <div id="ahpQuestionContainer"></div>
                            
                            <div id="ahpResultSection" class="hidden">
                                <div class="ahp-result-box mt-3 p-3" style="background: linear-gradient(135deg, #d4edda, #c3e6cb); border-radius: 8px;">
                                    <strong>计算得出的权重：</strong>
                                    <div id="weightsDisplay" class="mt-2"></div>
                                    <div id="consistencyCheck" class="consistency-check mt-2"></div>
                                </div>
                            </div>
                        </div>

                        <div class="formula-box">
                            <strong>计算规则：</strong><br>
                            <div class="mt-2">
                                <span class="direction-tag positive">正向</span> 得分 = <code>分值 × 权重%</code>
                            </div>
                            <div class="mt-2">
                                <span class="direction-tag negative">反向</span> 得分 = <code>(10 - 分值) × 权重%</code>
                            </div>
                            <div class="mt-2 border-top pt-2">
                                <strong>方案总分</strong> = 各因子得分之和
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：OKR编辑区 -->
            <div class="col-lg-8">
                <div class="card okr-section">
                    <div class="card-header">OKR与方案管理</div>
                    <div class="card-body">
                        <div class="mb-4">
                            <label class="form-label fw-bold">OKR核心目标</label>
                            <input type="text" class="form-control okr-title-input" id="okrTitle" 
                                   placeholder="例如：Q3完成毕业设计核心功能开发">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">关键结果 (KR) 与实现方案</h5>
                            <button class="btn btn-primary btn-sm" onclick="addKR()">+ 添加KR</button>
                        </div>

                        <div id="krList"></div>

                        <div class="text-center mt-4">
                            <button class="btn btn-success btn-lg px-5" onclick="calculateOptimal()">🎯 计算最优方案</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 结果展示区 -->
        <div class="card result-section" id="resultSection">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-bold">最优方案推荐</span>
                <button class="btn btn-outline-secondary btn-sm" onclick="hideResult()">返回编辑</button>
            </div>
            <div class="card-body" id="resultContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ==================== 数据模型 ====================
        let currentMode = 'simple';
        let factors = [
            { factorId: 'factor-1', name: '影响因子', direction: 'positive', weight: 60 },
            { factorId: 'factor-2', name: '开销', direction: 'negative', weight: 40 }
        ];

        // AHP数据
        let ahpComparisons = {}; // { 'factor1-factor2': value }  value > 1 表示 factor1 更重要
        let currentComparisonIndex = 0;
        let comparisonPairs = [];

        let okrData = { okrTitle: '', krList: [] };
        let krCounter = 0, planCounter = 0, factorCounter = 2;

        // ==================== 模式切换 ====================
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('simpleModeBtn').classList.toggle('active', mode === 'simple');
            document.getElementById('ahpModeBtn').classList.toggle('active', mode === 'ahp');
            document.getElementById('simpleModeSection').classList.toggle('hidden', mode !== 'simple');
            document.getElementById('ahpModeSection').classList.toggle('hidden', mode !== 'ahp');
            
            if (mode === 'ahp') {
                initAHPComparisons();
                renderAHPQuestionnaire();
            } else {
                renderFactorList();
            }
        }

        // ==================== 影响因子管理 ====================
        function addFactor() {
            factorCounter++;
            factors.push({ factorId: `factor-${factorCounter}`, name: '新因子', direction: 'positive', weight: 0 });
            renderFactorList();
            updateAllPlanScoreInputs();
            if (currentMode === 'ahp') { initAHPComparisons(); renderAHPQuestionnaire(); }
            else validateWeights();
        }

        function renderFactorList() {
            const container = document.getElementById('factorList');
            container.innerHTML = '';
            factors.forEach(f => renderFactorItem(f));
        }

        function renderFactorItem(factor) {
            const container = document.getElementById('factorList');
            const weightHtml = currentMode === 'simple'
                ? `<div class="d-flex align-items-center gap-1">
                       <input type="number" class="form-control form-control-sm weight-input" 
                              value="${factor.weight}" min="0" max="100"
                              onchange="updateFactorWeight('${factor.factorId}', this.value)">
                       <span class="text-muted small">%</span>
                   </div>`
                : `<div class="weight-display">${factor.weight.toFixed(1)}%</div>`;

            const div = document.createElement('div');
            div.className = 'factor-item';
            div.id = `factor-item-${factor.factorId}`;
            div.innerHTML = `
                <div class="factor-row">
                    <input type="text" class="form-control form-control-sm factor-name-input" 
                           value="${factor.name}" placeholder="因子名称"
                           onchange="updateFactorName('${factor.factorId}', this.value)">
                    <select class="form-select form-select-sm direction-select" 
                            onchange="updateFactorDirection('${factor.factorId}', this.value)">
                        <option value="positive" ${factor.direction === 'positive' ? 'selected' : ''}>正向</option>
                        <option value="negative" ${factor.direction === 'negative' ? 'selected' : ''}>反向</option>
                    </select>
                    ${weightHtml}
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteFactor('${factor.factorId}')"
                            ${factors.length <= 2 ? 'disabled title="至少保留2个因子"' : ''}>×</button>
                </div>`;
            container.appendChild(div);
        }

        function updateFactorName(factorId, name) {
            const f = factors.find(f => f.factorId === factorId);
            if (f) { f.name = name.trim(); updateAllPlanScoreInputs(); }
            if (currentMode === 'ahp') renderAHPQuestionnaire();
        }

        function updateFactorDirection(factorId, direction) {
            const f = factors.find(f => f.factorId === factorId);
            if (f) f.direction = direction;
            updateAllPlanScoreInputs();
        }

        function updateFactorWeight(factorId, weight) {
            const f = factors.find(f => f.factorId === factorId);
            if (f) { f.weight = parseInt(weight) || 0; validateWeights(); }
        }

        function deleteFactor(factorId) {
            if (factors.length <= 2) { showAlert('至少需要保留2个影响因子！'); return; }
            factors = factors.filter(f => f.factorId !== factorId);
            renderFactorList();
            updateAllPlanScoreInputs();
            if (currentMode === 'ahp') { initAHPComparisons(); renderAHPQuestionnaire(); }
            else validateWeights();
        }

        function validateWeights() {
            const total = factors.reduce((sum, f) => sum + f.weight, 0);
            const el = document.getElementById('weightStatus');
            if (Math.abs(total - 100) < 0.1) { 
                el.className = 'weight-status valid'; 
                el.textContent = '✓ 权重总和：100%'; 
                return true; 
            }
            else { 
                el.className = 'weight-status invalid'; 
                el.textContent = `✗ 权重总和：${total.toFixed(1)}%（需100%）`; 
                return false; 
            }
        }

        // ==================== AHP问答式界面 ====================
        function initAHPComparisons() {
            // 生成所有两两比较对
            comparisonPairs = [];
            ahpComparisons = {};
            for (let i = 0; i < factors.length; i++) {
                for (let j = i + 1; j < factors.length; j++) {
                    const key = `${factors[i].factorId}-${factors[j].factorId}`;
                    comparisonPairs.push({ f1: factors[i], f2: factors[j], key });
                    ahpComparisons[key] = 1; // 默认同等重要
                }
            }
            currentComparisonIndex = 0;
            document.getElementById('ahpResultSection').classList.add('hidden');
        }

        function renderAHPQuestionnaire() {
            const container = document.getElementById('ahpQuestionContainer');
            if (comparisonPairs.length === 0) { 
                container.innerHTML = '<p class="text-muted">请至少添加2个因子</p>'; 
                return; 
            }

            const total = comparisonPairs.length;
            const pair = comparisonPairs[currentComparisonIndex];
            const currentVal = ahpComparisons[pair.key];
            
            // 解析当前值确定滑块位置
            // ahpComparisons[key] > 1 表示 f1 更重要，滑块应在左边（负值）
            // ahpComparisons[key] < 1 表示 f2 更重要，滑块应在右边（正值）
            // ahpComparisons[key] = 1 表示同等重要，滑块在中间（0）
            let sliderVal = 0;
            let selectedSide = 'equal';
            if (currentVal > 1) { 
                sliderVal = -currentVal;  // 负值表示左边因子更重要
                selectedSide = 'left'; 
            }
            else if (currentVal < 1) { 
                sliderVal = 1 / currentVal;  // 正值表示右边因子更重要
                selectedSide = 'right'; 
            }
            else { 
                sliderVal = 0; 
                selectedSide = 'equal'; 
            }

            // 进度
            const progress = ((currentComparisonIndex + 1) / total * 100).toFixed(0);

            container.innerHTML = `
                <div class="ahp-question-card">
                    <div class="ahp-progress">
                        <span class="ahp-progress-text">问题 ${currentComparisonIndex + 1} / ${total}</span>
                        <div class="ahp-progress-bar"><div class="ahp-progress-fill" style="width: ${progress}%"></div></div>
                        <span class="ahp-progress-text">${progress}%</span>
                    </div>

                    <div class="comparison-display">
                        <div class="comparison-factor left ${selectedSide === 'left' ? 'selected' : ''}" id="compLeft">
                            <div class="factor-name">${pair.f1.name}</div>
                            <div class="factor-hint">左侧因子</div>
                        </div>
                        <div class="comparison-vs">VS</div>
                        <div class="comparison-factor right ${selectedSide === 'right' ? 'selected' : ''}" id="compRight">
                            <div class="factor-name">${pair.f2.name}</div>
                            <div class="factor-hint">右侧因子</div>
                        </div>
                    </div>

                    <div class="slider-container">
                        <div class="slider-labels">
                            <span><strong>${pair.f1.name}</strong> 更重要</span>
                            <span>同等重要</span>
                            <span><strong>${pair.f2.name}</strong> 更重要</span>
                        </div>
                        <div class="slider-wrapper">
                            <input type="range" class="importance-slider" id="importanceSlider"
                                   min="-9" max="9" step="1" value="${sliderVal}"
                                   oninput="updateSliderDisplay('${pair.key}', this.value, '${pair.f1.name}', '${pair.f2.name}')">
                        </div>
                        <div class="slider-value-display" id="sliderDisplay">
                            <div class="value">1</div>
                            <div class="description">两者<strong>同等重要</strong></div>
                        </div>
                    </div>

                    <div class="ahp-nav-buttons">
                        <button class="btn btn-outline-secondary btn-sm" onclick="prevComparison()" ${currentComparisonIndex === 0 ? 'disabled' : ''}>
                            ← 上一题
                        </button>
                        ${currentComparisonIndex < total - 1 
                            ? `<button class="btn btn-primary btn-sm" onclick="nextComparison()">下一题 →</button>`
                            : `<button class="btn btn-success btn-sm" onclick="finishAHP()">完成计算 ✓</button>`
                        }
                    </div>
                </div>

                <!-- 已完成的比较汇总 -->
                ${currentComparisonIndex > 0 ? `
                <div class="ahp-summary">
                    <small class="text-muted">已完成的比较：</small>
                    ${comparisonPairs.slice(0, currentComparisonIndex).map((p, idx) => {
                        const v = ahpComparisons[p.key];
                        const result = v > 1 ? `${p.f1.name} 更重要 (${v}倍)` 
                                   : v < 1 ? `${p.f2.name} 更重要 (${(1/v).toFixed(1)}倍)`
                                   : '同等重要';
                        return `<div class="summary-item"><span class="names">${p.f1.name} VS ${p.f2.name}</span><span class="result">${result}</span></div>`;
                    }).join('')}
                </div>` : ''}
            `;

            // 初始化显示
            updateSliderDisplay(pair.key, sliderVal, pair.f1.name, pair.f2.name);
        }

        function updateSliderDisplay(key, value, name1, name2) {
            const v = parseInt(value);
            const display = document.getElementById('sliderDisplay');
            const leftEl = document.getElementById('compLeft');
            const rightEl = document.getElementById('compRight');

            let ahpValue, displayVal, description;

            // 滑块逻辑：
            // v < 0（负值，滑块在左边）→ 左边因子(name1)更重要
            // v > 0（正值，滑块在右边）→ 右边因子(name2)更重要
            // v = 0 → 同等重要
            
            if (v < 0) {
                // 左边因子更重要
                ahpValue = Math.abs(v);  // ahpValue > 1 表示 key 中第一个因子更重要
                displayVal = Math.abs(v);
                description = `<strong>${name1}</strong> 比 <strong>${name2}</strong> ${getImportanceText(Math.abs(v))}`;
                leftEl.classList.add('selected');
                rightEl.classList.remove('selected');
            } else if (v > 0) {
                // 右边因子更重要
                ahpValue = 1 / v;  // ahpValue < 1 表示 key 中第二个因子更重要
                displayVal = v;
                description = `<strong>${name2}</strong> 比 <strong>${name1}</strong> ${getImportanceText(v)}`;
                leftEl.classList.remove('selected');
                rightEl.classList.add('selected');
            } else {
                // 同等重要
                ahpValue = 1;
                displayVal = 1;
                description = `两者<strong>同等重要</strong>`;
                leftEl.classList.remove('selected');
                rightEl.classList.remove('selected');
            }

            ahpComparisons[key] = ahpValue;
            display.innerHTML = `<div class="value">${displayVal}</div><div class="description">${description}</div>`;
        }

        function getImportanceText(val) {
            if (val === 1) return '同等重要';
            const texts = { 
                2: '稍微重要', 3: '稍微重要', 
                4: '明显重要', 5: '明显重要',
                6: '强烈重要', 7: '强烈重要', 
                8: '极端重要', 9: '极端重要' 
            };
            return texts[val] || '更重要';
        }

        function prevComparison() {
            if (currentComparisonIndex > 0) {
                currentComparisonIndex--;
                renderAHPQuestionnaire();
            }
        }

        function nextComparison() {
            if (currentComparisonIndex < comparisonPairs.length - 1) {
                currentComparisonIndex++;
                renderAHPQuestionnaire();
            }
        }

        function finishAHP() {
            calculateAHPWeights();
        }

        function calculateAHPWeights() {
            const n = factors.length;
            
            // 构建判断矩阵
            const matrix = {};
            factors.forEach(fi => { 
                matrix[fi.factorId] = {}; 
                factors.forEach(fj => { 
                    matrix[fi.factorId][fj.factorId] = 1; 
                }); 
            });

            // 填充矩阵（根据两两比较结果）
            for (let [key, value] of Object.entries(ahpComparisons)) {
                const [id1, id2] = key.split('-');
                // value > 1 表示 id1 比 id2 重要 value 倍
                // value < 1 表示 id2 比 id1 重要 (1/value) 倍
                matrix[id1][id2] = value;
                matrix[id2][id1] = 1 / value;
            }

            // 几何平均法计算权重
            const weights = [];
            factors.forEach(fi => {
                let product = 1;
                factors.forEach(fj => { 
                    product *= matrix[fi.factorId][fj.factorId]; 
                });
                weights.push(Math.pow(product, 1 / n));
            });

            // 归一化
            const sum = weights.reduce((a, b) => a + b, 0);
            factors.forEach((f, i) => { 
                f.weight = (weights[i] / sum) * 100; 
            });

            // 一致性检验
            let lambdaMax = 0;
            factors.forEach((fi, i) => {
                let colSum = 0;
                factors.forEach((fj, j) => { 
                    colSum += matrix[fj.factorId][fi.factorId]; 
                });
                lambdaMax += colSum * (weights[i] / sum);
            });

            const CI = (lambdaMax - n) / (n - 1);
            const RI = [0, 0, 0.58, 0.90, 1.12, 1.24, 1.32, 1.41, 1.45, 1.49];
            const CR = n >= 3 ? CI / RI[n] : 0;

            // 显示结果
            document.getElementById('ahpResultSection').classList.remove('hidden');
            
            const weightsDisplay = document.getElementById('weightsDisplay');
            weightsDisplay.innerHTML = factors.map(f => 
                `<div style="display: inline-block; background: white; padding: 6px 12px; border-radius: 6px; margin: 4px;">
                    <strong>${f.name}</strong>: <span style="color: var(--primary-color); font-weight: 700;">${f.weight.toFixed(1)}%</span>
                </div>`
            ).join('');

            const checkEl = document.getElementById('consistencyCheck');
            if (CR < 0.1) {
                checkEl.className = 'consistency-check pass';
                checkEl.innerHTML = `✓ 一致性检验通过：CR = ${CR.toFixed(4)} < 0.1，权重分配合理`;
            } else {
                checkEl.className = 'consistency-check fail';
                checkEl.innerHTML = `⚠ 一致性检验：CR = ${CR.toFixed(4)}，建议重新调整比较结果`;
            }

            renderFactorList();
            updateAllPlanScoreInputs();
        }

        // ==================== KR管理 ====================
        function addKR() {
            const okrTitle = document.getElementById('okrTitle').value.trim();
            if (!okrTitle) { showAlert('请先输入OKR核心目标！'); return; }
            krCounter++;
            okrData.krList.push({ krId: `kr-${krCounter}`, krTitle: '', plans: [] });
            okrData.okrTitle = okrTitle;
            renderKRCard(okrData.krList[okrData.krList.length - 1]);
        }

        function renderKRCard(krObj) {
            const container = document.getElementById('krList');
            const idx = okrData.krList.findIndex(k => k.krId === krObj.krId) + 1;
            const div = document.createElement('div');
            div.className = 'kr-card';
            div.id = krObj.krId;
            div.innerHTML = `
                <div class="kr-header">
                    <div class="kr-title-area">
                        <span class="kr-number">${idx}</span>
                        <input type="text" class="form-control kr-title-input" placeholder="输入KR名称"
                               onchange="updateKRTitle('${krObj.krId}', this.value)">
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="deleteKR('${krObj.krId}')">删除KR</button>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-muted small">为该KR添加多个实现方案进行对比：</span>
                    <button class="btn btn-success btn-sm" onclick="addPlan('${krObj.krId}')">+ 添加方案</button>
                </div>
                <div class="plans-container" id="plans-${krObj.krId}"></div>`;
            container.appendChild(div);
        }

        function updateKRTitle(krId, title) {
            const kr = okrData.krList.find(k => k.krId === krId);
            if (kr) kr.krTitle = title.trim();
        }

        function deleteKR(krId) {
            if (confirm('确定删除此KR及其所有方案吗？')) {
                okrData.krList = okrData.krList.filter(k => k.krId !== krId);
                document.getElementById(krId)?.remove();
                renumberKR();
            }
        }

        function renumberKR() {
            document.querySelectorAll('.kr-card').forEach((card, index) => {
                const numberSpan = card.querySelector('.kr-number');
                if (numberSpan) numberSpan.textContent = index + 1;
            });
        }

        // ==================== 方案管理 ====================
        function addPlan(krId) {
            const kr = okrData.krList.find(k => k.krId === krId);
            if (!kr) return;
            planCounter++;
            const factorScores = {}; 
            factors.forEach(f => { factorScores[f.factorId] = 5; });
            kr.plans.push({ planId: `plan-${planCounter}`, planName: '', factorScores, totalScore: 0 });
            renderPlanCard(krId, kr.plans[kr.plans.length - 1]);
        }

        function renderPlanCard(krId, planObj) {
            const container = document.getElementById(`plans-${krId}`);
            const kr = okrData.krList.find(k => k.krId === krId);
            const idx = kr.plans.findIndex(p => p.planId === planObj.planId) + 1;
            const div = document.createElement('div');
            div.className = 'plan-card';
            div.id = planObj.planId;
            div.innerHTML = `
                <div class="plan-header">
                    <div class="plan-name">
                        <span class="badge bg-secondary">方案${idx}</span>
                        <input type="text" class="form-control form-control-sm plan-name-input" placeholder="方案名称"
                               onchange="updatePlanName('${krId}', '${planObj.planId}', this.value)">
                    </div>
                    <button class="btn btn-outline-danger btn-sm" onclick="deletePlan('${krId}', '${planObj.planId}')">删除</button>
                </div>
                <div class="factor-scores-grid" id="scores-${planObj.planId}"></div>`;
            container.appendChild(div);
            renderPlanFactorScores(planObj.planId, planObj);
        }

        function renderPlanFactorScores(planId, planObj) {
            const container = document.getElementById(`scores-${planId}`);
            if (!container) return;
            container.innerHTML = '';
            factors.forEach(f => {
                const score = planObj.factorScores[f.factorId] || 5;
                const hint = f.direction === 'positive' ? '分值越高越好' : '分值越高成本越大';
                const div = document.createElement('div');
                div.className = 'factor-score-item';
                div.innerHTML = `
                    <label>${f.name} <span class="direction-tag ${f.direction}">${f.direction === 'positive' ? '正向' : '反向'}</span>
                        <small class="text-muted">(${f.weight.toFixed(1)}%)</small></label>
                    <input type="number" class="form-control form-control-sm" min="1" max="10" value="${score}"
                           onchange="updatePlanFactorScore('${planId}', '${f.factorId}', this.value)">
                    <div class="hint">${hint}</div>`;
                container.appendChild(div);
            });
        }

        function updateAllPlanScoreInputs() {
            okrData.krList.forEach(kr => {
                kr.plans.forEach(p => {
                    // 确保所有因子都有评分
                    factors.forEach(f => {
                        if (p.factorScores[f.factorId] === undefined) {
                            p.factorScores[f.factorId] = 5;
                        }
                    });
                    renderPlanFactorScores(p.planId, p);
                });
            });
        }

        function updatePlanName(krId, planId, name) {
            const kr = okrData.krList.find(k => k.krId === krId);
            if (kr) { 
                const p = kr.plans.find(p => p.planId === planId); 
                if (p) p.planName = name.trim(); 
            }
        }

        function updatePlanFactorScore(planId, factorId, value) {
            for (let kr of okrData.krList) {
                const p = kr.plans.find(p => p.planId === planId);
                if (p) { 
                    p.factorScores[factorId] = Math.max(1, Math.min(10, parseInt(value) || 5)); 
                    break; 
                }
            }
        }

        function deletePlan(krId, planId) {
            const kr = okrData.krList.find(k => k.krId === krId);
            if (kr) { 
                kr.plans = kr.plans.filter(p => p.planId !== planId); 
                document.getElementById(planId)?.remove();
                renumberPlans(krId);
            }
        }

        function renumberPlans(krId) {
            const container = document.getElementById(`plans-${krId}`);
            if (!container) return;
            container.querySelectorAll('.plan-card').forEach((card, index) => {
                const badge = card.querySelector('.badge');
                if (badge) badge.textContent = `方案${index + 1}`;
            });
        }

        // ==================== 计算最优方案 ====================
        function calculateOptimal() {
            // 校验权重总和
            const total = factors.reduce((sum, f) => sum + f.weight, 0);
            if (Math.abs(total - 100) > 0.1) { 
                showAlert(`权重总和为${total.toFixed(1)}%，请先确保权重总和为100%！`); 
                return; 
            }
            
            // 校验OKR标题
            if (!document.getElementById('okrTitle').value.trim()) { 
                showAlert('请先输入OKR核心目标！'); 
                return; 
            }
            
            // 校验KR数量
            if (okrData.krList.length === 0) { 
                showAlert('请先添加至少1个KR！'); 
                return; 
            }
            
            // 校验每个KR至少有2个方案
            for (let kr of okrData.krList) {
                if (kr.plans.length < 2) { 
                    showAlert(`KR"${kr.krTitle || '未命名'}"至少需要2个方案！`); 
                    return; 
                }
                for (let p of kr.plans) {
                    if (!p.planName) { 
                        showAlert('请为所有方案填写名称！'); 
                        return; 
                    }
                }
            }

            // 计算每个方案的综合得分
            for (let kr of okrData.krList) {
                for (let plan of kr.plans) {
                    let totalScore = 0;
                    plan.scoreDetails = {};
                    
                    factors.forEach(f => {
                        const raw = plan.factorScores[f.factorId] || 5;
                        let calc;
                        if (f.direction === 'positive') {
                            // 正向：分值越高得分越高
                            calc = raw * f.weight / 100;
                        } else {
                            // 反向：分值越高得分越低
                            calc = (10 - raw) * f.weight / 100;
                        }
                        totalScore += calc;
                        plan.scoreDetails[f.factorId] = { 
                            name: f.name, 
                            direction: f.direction, 
                            rawScore: raw, 
                            weight: f.weight, 
                            calculatedScore: calc 
                        };
                    });
                    
                    plan.totalScore = totalScore;
                }
                
                // 按得分降序排序
                kr.plans.sort((a, b) => b.totalScore - a.totalScore);
            }
            
            renderResult();
        }

        // ==================== 结果展示 ====================
        function renderResult() {
            const content = document.getElementById('resultContent');
            let html = `
                <div class="alert alert-info mb-4"><strong>OKR目标：</strong>${okrData.okrTitle}</div>
                <div class="alert alert-secondary mb-4"><strong>评分因子：</strong>
                    ${factors.map(f => `${f.name}(${f.weight.toFixed(1)}%, ${f.direction === 'positive' ? '正向' : '反向'})`).join('、')}
                </div>`;

            okrData.krList.forEach((kr, i) => {
                const best = kr.plans[0];
                html += `<div class="result-kr-card">
                    <div class="result-kr-header">
                        <span class="result-kr-title">KR${i + 1}：${kr.krTitle || '未命名'}</span>
                        <span class="best-plan-badge">最优方案：${best.planName}</span>
                    </div>
                    <div class="result-plans">
                        ${kr.plans.map((p, j) => `
                            <div class="result-plan-item ${j === 0 ? 'best' : ''}">
                                <div class="result-plan-header">
                                    <span class="result-plan-name">${j === 0 ? '<span class="badge bg-success me-2">推荐</span>' : ''}${p.planName}</span>
                                    <span class="result-plan-score ${j === 0 ? 'best' : ''}">${p.totalScore.toFixed(2)}</span>
                                </div>
                                <div class="result-scores-detail">
                                    ${Object.values(p.scoreDetails).map(d => `
                                        <span class="score-detail-item">${d.name}(${d.weight.toFixed(1)}%): 
                                            <span class="value">${d.rawScore}</span> → <span class="value">${d.calculatedScore.toFixed(2)}</span>
                                            <span class="direction-tag ${d.direction}">${d.direction === 'positive' ? '正' : '反'}</span>
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            });
            
            content.innerHTML = html;
            document.getElementById('resultSection').classList.add('show');
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function hideResult() { 
            document.getElementById('resultSection').classList.remove('show'); 
        }
        
        function showAlert(msg) { 
            alert(msg); 
        }

        // ==================== 页面初始化 ====================
        window.addEventListener('load', () => {
            renderFactorList();
            initAHPComparisons();
        });
    </script>
</body>
</html>
